<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuildWeb Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    /* Smooth scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }
  </style>
</head>
<body class="bg-[#0d1117] text-gray-100 min-h-screen selection:bg-blue-600 selection:text-white antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken, 
      onAuthStateChanged,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc,
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot 
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const { useState, useEffect, useRef } = React;

    // --- Target B SVG Logo ---
    const TargetLogo = ({ className = "w-7 h-7", color = "currentColor" }) => (
      <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="36" stroke={color} strokeWidth="6" />
        <line x1="50" y1="5" x2="50" y2="22" stroke={color} strokeWidth="6" strokeLinecap="round" />
        <line x1="50" y1="78" x2="50" y2="95" stroke={color} strokeWidth="6" strokeLinecap="round" />
        <line x1="5" y1="50" x2="22" y2="50" stroke={color} strokeWidth="6" strokeLinecap="round" />
        <line x1="78" y1="50" x2="95" y2="50" stroke={color} strokeWidth="6" strokeLinecap="round" />
        <text x="50" y="63" fontSize="42" fontWeight="900" fill={color} textAnchor="middle" fontFamily="sans-serif">B</text>
      </svg>
    );

    // --- Inline Icon Components ---
    const IconPlus = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconSearch = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const IconBell = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
    const IconSun = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
    const IconMoon = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
    const IconShield = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
    const IconThumbsUp = () => <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>;
    const IconExternalLink = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>;
    const IconMessageSquare = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    const IconLogIn = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>;
    const IconLogOut = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    const IconSend = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
    const IconX = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconLock = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const IconUser = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const IconActivity = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;

    const IconGoogle = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3h3.88c2.27-2.09 3.665-5.17 3.665-9.12z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.1 0-5.74-2.09-6.68-4.91H1.28v3.09C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.32 14.34c-.24-.72-.38-1.49-.38-2.34s.14-1.62.38-2.34V6.57H1.28v3.09c-.47 1.78-.72 3.56-.72 5.43s.25 3.65.72 5.43l4.04-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.28 6.57l4.04 3.09c.94-2.82 3.58-4.91 6.68-4.91z"/>
      </svg>
    );

    // --- Firebase Setup ---
    const firebaseConfig = typeof __firebase_config !== 'undefined'
      ? JSON.parse(__firebase_config)
      : {
          apiKey: "demo-api-key",
          authDomain: "demo.firebaseapp.com",
          projectId: "demo-project",
          storageBucket: "demo.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:demo"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'buildweb-platform';

    function App() {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('explore');
      const [exploreFilter, setExploreFilter] = useState('Popular');
      
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [language, setLanguage] = useState('ko');

      const [showSearchModal, setShowSearchModal] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [showNotifModal, setShowNotifModal] = useState(false);
      const [notifications, setNotifications] = useState([
        { id: 1, title: 'BuildWeb 플랫폼에 오신 것을 환영합니다!', time: '방금 전', unread: true },
        { id: 2, title: '실시간 빌더 대화방이 열려있습니다.', time: '10분 전', unread: true },
        { id: 3, title: '새 사이드 프로젝트가 등록되었습니다.', time: '1시간 전', unread: false }
      ]);

      // 100% 사실(Fact) 기반 실측 데이터로만 초기화 (하드코딩된 더미/가짜 데이터 전면 제거)
      const [projects, setProjects] = useState([]);
      const [communityPosts, setCommunityPosts] = useState([]);
      const [buildersList, setBuildersList] = useState([]); // 실제 회원가입/로그인된 계정만 실시간 집계
      const [chatMessages, setChatMessages] = useState([]); // 실제 전송된 대화 메시지만 실시간 집계
      const [newMessageText, setNewMessageText] = useState('');
      const [visitCount, setVisitCount] = useState(0); // 실제 접속된 순 방문 세션만 정확히 카운트
      const chatEndRef = useRef(null);

      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [adminError, setAdminError] = useState('');

      const [isUserLoggedIn, setIsUserLoggedIn] = useState(false);
      const [userEmail, setUserEmail] = useState('');
      const [userName, setUserName] = useState('게스트 빌더');
      const [userPhoto, setUserPhoto] = useState('');
      const [userBio, setUserBio] = useState('BuildWeb에서 새로운 사이드 프로젝트를 만들어가는 빌더입니다.');
      const [loginMethod, setLoginMethod] = useState('');

      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginTab, setLoginStep] = useState('buildweb-login'); // 'buildweb-login' | 'buildweb-signup' | 'google'
      const [loginError, setLoginError] = useState('');
      const [loginSuccess, setLoginSuccess] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);

      // BuildWeb 자체 계정 로그인 및 회원가입 전용 폼 상태
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [signupName, setSignupName] = useState('');
      const [signupEmail, setSignupEmail] = useState('');
      const [signupPassword, setSignupPassword] = useState('');
      const [signupPasswordConfirm, setSignupPasswordConfirm] = useState('');

      // 구글 로그인 도메인 제약 시 직입력 연동 상태
      const [googleFallbackActive, setGoogleFallbackActive] = useState(false);
      const [googleInputEmail, setGoogleInputEmail] = useState('');
      const [googleInputName, setGoogleInputName] = useState('');
      const [googleInputPassword, setGoogleInputPassword] = useState('');

      const [wizardStep, setWizardStep] = useState(1);
      const [newProjectData, setNewProjectData] = useState({
        title: '',
        tagline: '',
        description: '',
        logoUrl: '',
        gradient: 'from-blue-600 to-indigo-600',
        tags: ['AI', 'Productivity'],
        stage: 'Public',
        helpNeeded: [],
        websiteUrl: '',
        demoUrl: '',
        githubUrl: '',
        discordUrl: ''
      });

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.warn("Auth initialization note:", err.message);
          }
        };
        initAuth();

        // 브라우저 세션에 저장된 BuildWeb 계정이 있다면 자동 복원
        try {
          const savedSession = sessionStorage.getItem('buildweb_session_user');
          if (savedSession) {
            const parsed = JSON.parse(savedSession);
            setIsUserLoggedIn(true);
            setUserEmail(parsed.email || '');
            setUserName(parsed.name || '');
            setUserPhoto(parsed.photoURL || '');
            setUserBio(parsed.bio || '');
            setLoginMethod(parsed.provider || 'BuildWeb 자체 계정');
          }
        } catch (_) {}

        const unsubscribe = onAuthStateChanged(auth, (usr) => {
          setUser(usr);
          // 구글이나 외부 인증 제공자에서 이메일이 들어온 경우
          if (usr && usr.email && !sessionStorage.getItem('buildweb_session_user')) {
            setIsUserLoggedIn(true);
            setUserEmail(usr.email || '');
            setUserName(usr.displayName || usr.email.split('@')[0]);
            setUserPhoto(usr.photoURL || '');
          }
          if (usr) {
            try {
              const sessionKey = `buildweb_session_${appId}`;
              if (!sessionStorage.getItem(sessionKey)) {
                sessionStorage.setItem(sessionKey, 'true');
                const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'visitors');
                getDoc(statsRef).then((snap) => {
                  const current = snap.exists() ? (snap.data().count || 0) : 0;
                  setDoc(statsRef, { count: current + 1, lastVisited: new Date().toISOString() }, { merge: true }).catch(() => {});
                }).catch(() => {});
              }
            } catch (_) {}
          }
        });

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;

        let unsubProjects = () => {};
        let unsubPosts = () => {};
        let unsubBuilders = () => {};
        let unsubChat = () => {};
        let unsubStats = () => {};

        try {
          unsubProjects = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), (snapshot) => {
            setProjects(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          }, (err) => console.warn("Firestore projects snapshot notice:", err.message));

          unsubPosts = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'community'), (snapshot) => {
            setCommunityPosts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          }, (err) => console.warn("Firestore community snapshot notice:", err.message));

          unsubBuilders = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'builders'), (snapshot) => {
            // 실제 데이터베이스에 등록된 빌더 문서만 반영
            setBuildersList(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          }, (err) => console.warn("Firestore builders snapshot notice:", err.message));

          unsubChat = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'chat'), (snapshot) => {
            // 실제 작성된 채팅 메시지만 반영
            const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
            setChatMessages(list);
          }, (err) => console.warn("Firestore chat snapshot notice:", err.message));

          unsubStats = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'visitors'), (docSnap) => {
            if (docSnap.exists()) {
              setVisitCount(docSnap.data().count || 0);
            } else {
              setVisitCount(0);
            }
          }, (err) => console.warn("Firestore stats snapshot notice:", err.message));
        } catch (e) {
          console.warn("Firestore sync setup:", e.message);
        }

        return () => {
          unsubProjects();
          unsubPosts();
          unsubBuilders();
          unsubChat();
          unsubStats();
        };
      }, [user]);

      useEffect(() => {
        if (activeTab === 'chat') {
          chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, activeTab]);

      // 1. BuildWeb 전용 신규 계정 생성 (회원가입)
      const handleBuildWebSignUp = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginSuccess('');

        const trimmedName = signupName.trim();
        const trimmedEmail = signupEmail.trim().toLowerCase();
        const pwd = signupPassword.trim();
        const pwdConfirm = signupPasswordConfirm.trim();

        if (!trimmedName) {
          setLoginError('빌더 닉네임을 입력해주세요.');
          return;
        }
        if (!trimmedEmail || !trimmedEmail.includes('@') || !trimmedEmail.includes('.')) {
          setLoginError('올바른 이메일 주소를 입력해주세요.');
          return;
        }
        if (pwd.length < 4) {
          setLoginError('비밀번호는 최소 4자리 이상이어야 합니다.');
          return;
        }
        if (pwd !== pwdConfirm) {
          setLoginError('비밀번호와 비밀번호 확인이 일치하지 않습니다.');
          return;
        }

        // 이미 가입된 이메일인지 실측 확인
        const emailAlreadyExists = buildersList.some(
          b => b.email && b.email.toLowerCase() === trimmedEmail
        );
        if (emailAlreadyExists) {
          setLoginError('이미 등록된 이메일 주소입니다. 로그인 탭으로 이동해주세요.');
          return;
        }

        setLoginLoading(true);
        try {
          const newUserId = 'user-' + Date.now();
          const newAccountData = {
            id: newUserId,
            uid: newUserId,
            name: trimmedName,
            email: trimmedEmail,
            password: pwd, // 웹 플랫폼 내부 계정 인증용
            bio: `${trimmedName} 님의 BuildWeb 프로필입니다.`,
            photoURL: '',
            provider: 'BuildWeb 자체 계정',
            joinedAt: new Date().toLocaleDateString(),
            role: 'Verified Web Builder'
          };

          // Firestore DB에 영구 저장
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'builders', newUserId), newAccountData);

          // 브라우저 세션 저장
          sessionStorage.setItem('buildweb_session_user', JSON.stringify(newAccountData));

          // 현재 상태 즉시 반영
          setIsUserLoggedIn(true);
          setUserEmail(trimmedEmail);
          setUserName(trimmedName);
          setUserPhoto('');
          setUserBio(newAccountData.bio);
          setLoginMethod('BuildWeb 자체 계정');

          setLoginSuccess('BuildWeb 계정이 성공적으로 생성되었습니다!');
          setTimeout(() => {
            setShowLoginModal(false);
            setLoginSuccess('');
            setSignupPassword('');
            setSignupPasswordConfirm('');
          }, 800);
        } catch (err) {
          console.error("Sign up error:", err);
          setLoginError(`계정 생성 오류: ${err.message}`);
        } finally {
          setLoginLoading(false);
        }
      };

      // 2. BuildWeb 전용 계정 로그인
      const handleBuildWebLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginSuccess('');

        const trimmedEmail = loginEmail.trim().toLowerCase();
        const pwd = loginPassword.trim();

        if (!trimmedEmail || !pwd) {
          setLoginError('이메일과 비밀번호를 모두 입력해주세요.');
          return;
        }

        // Firestore에서 동기화된 회원 목록 중 일치 계정 탐색
        const matchedUser = buildersList.find(
          b => b.email && b.email.toLowerCase() === trimmedEmail
        );

        if (!matchedUser) {
          setLoginError('등록되지 않은 이메일입니다. 회원가입을 먼저 진행해주세요.');
          return;
        }

        // 비밀번호 확인
        if (matchedUser.password && matchedUser.password !== pwd) {
          setLoginError('비밀번호가 일치하지 않습니다. 다시 확인해주세요.');
          return;
        }

        // 로그인 성공 처리
        sessionStorage.setItem('buildweb_session_user', JSON.stringify(matchedUser));
        setIsUserLoggedIn(true);
        setUserEmail(matchedUser.email);
        setUserName(matchedUser.name || matchedUser.email.split('@')[0]);
        setUserPhoto(matchedUser.photoURL || '');
        setUserBio(matchedUser.bio || 'BuildWeb 빌더입니다.');
        setLoginMethod(matchedUser.provider || 'BuildWeb 자체 계정');

        setLoginError('');

        try {
          const provider = new GoogleAuthProvider();
          const result = await signInWithPopup(auth, provider);
          const googleUser = result.user;

          const gEmail = googleUser.email || '';
          const gName = googleUser.displayName || gEmail.split('@')[0] || 'Google User';
          const gPhoto = googleUser.photoURL || '';

          const accountData = {
            id: googleUser.uid || ('g-' + Date.now()),
            uid: googleUser.uid,
            name: gName,
            email: gEmail,
            photoURL: gPhoto,
            bio: `${gName} 님의 구글 연동 빌더 프로필입니다.`,
            provider: 'Google 연동',
            joinedAt: new Date().toLocaleDateString(),
            role: 'Verified Web Builder'
          };

          // Firestore 동기화
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'builders', accountData.id), accountData, { merge: true });
          sessionStorage.setItem('buildweb_session_user', JSON.stringify(accountData));

          setIsUserLoggedIn(true);
          setUserEmail(gEmail);
          setUserName(gName);
          setUserPhoto(gPhoto);
          setLoginMethod('Google 연동');
          setShowLoginModal(false);
        } catch (error) {
          console.warn("Google Auth Handler note:", error);
          // 웹 샌드박스/아이프레임 환경에서는 도메인 미승인(unauthorized-domain)으로 팝업이 차단됩니다.
          setGoogleFallbackActive(true);
          setLoginError('현재 브라우저 미리보기 환경에서는 보안 정책으로 인해 구글 팝업 인증이 차단됩니다. 아래의 [구글 계정 연동 생성]을 사용하시거나 [BuildWeb 자체 계정]을 생성하시면 완벽히 로그인할 수 있습니다.');
        } finally {
          setLoginLoading(false);
        }
      };

            uid: docId,
            name: displayName,
            email: trimmedEmail,
            password: pwd,
            bio: `${displayName} 님의 구글 연동 프로필입니다.`,

                        <div>
                          <label className="text-[11px] font-semibold text-gray-300">닉네임</label>
                          <input 
                            type="text" 
                            placeholder="표시할 빌더 이름" 
                            value={googleInputName}
                            onChange={(e) => setGoogleInputName(e.target.value)}
                            className="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] font-semibold text-gray-300">비밀번호 (나중에 재로그인용)</label>
                          <input 
                            type="password" 
                            placeholder="비밀번호 설정" 
                            value={googleInputPassword}
                            onChange={(e) => setGoogleInputPassword(e.target.value)}
                            className="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                          />
                        </div>
                        <button 
                          type="submit" 
                          disabled={loginLoading}
                          className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs shadow transition-all active:scale-95 disabled:opacity-50"
                        >
                          {loginLoading ? "연동 처리 중..." : "구글 계정으로 즉시 연동 및 로그인"}
                        </button>
                      </form>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          <footer className="border-t border-gray-800/80 bg-[#161b22]/50 py-6 px-4 text-center text-xs text-gray-500">
            <p>© 2026 BuildWeb Platform. All rights reserved.</p>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
